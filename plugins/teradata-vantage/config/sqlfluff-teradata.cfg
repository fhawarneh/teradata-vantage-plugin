# teradata-vantage plugin — sqlfluff configuration used by the optional .sql lint hook (scripts/hooks/sql_lint.py)
# when the edited file's repository has no sqlfluff configuration of its own. Passed with --config; never written
# into your repository.
[sqlfluff]
dialect = teradata
templater = raw
sql_file_exts = .sql,.bteq,.btq,.ddl,.dml
large_file_skip_byte_limit = 0
max_line_length = 0
processes = 1

[sqlfluff:rules:capitalisation.keywords]
capitalisation_policy = consistent
