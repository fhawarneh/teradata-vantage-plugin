      (references carry a one-line purpose header, not frontmatter); the pilot-deployment section and every
      pilot-specific aside removed; the memory-file bullet removed.
    transforms:
      - type: frontmatter_rewrite
        strip: true
      - type: replace
        pattern: '^# AI-Native Data Products — Architecture Skill$'
        replacement: '# AI-Native Data Products — the six-module standard and its discovery flow (from github.com/Teradata/ai-native-data-products, MIT)'
        flags: m
        expected_count: 1
      - type: replace
        pattern: '^This skill teaches the'
        replacement: 'This reference describes the'
        flags: m
        expected_count: 1
      - type: delete_section
        heading: '^Pilot deployment'
        expected_count: 1
      - type: replace
        pattern: '^e\.g\., .*$'
        replacement: 'for example one deployed as `<Name>_Domain` plus `<Name>_Semantic`.'
        flags: m
        expected_count: 1
      - type: replace
        pattern: ' \(or `\{Name\}` for pilot clones\)'
        replacement: ''
        expected_count: 1
      - type: replace
        pattern: ' \(consolidated into `_Semantic` in the [A-Za-z]+ pilot\)'
        replacement: ' (smaller deployments may co-locate these tables in `_Semantic`)'
        expected_count: 1
      - type: replace
        pattern: ' \(consolidated into `_Semantic` in the pilot\)'
        replacement: ' (smaller deployments may co-locate these tables in `_Semantic`)'
        expected_count: 1
      - type: replace
        pattern: ' — not used in this pilot'
        replacement: ' (optional)'
        expected_count: 2
      - type: replace
        pattern: '^- Memory entries this skill supersedes:.*\n'
        replacement: ''
        flags: m
        expected_count: 1
      - type: replace
        pattern: '^- Module docs in this bundle: .*$'
        replacement: '- Module documentation: `modules/semantic.md`, `modules/memory.md`, `modules/observability.md` in the upstream repository.'
        flags: m
        expected_count: 1

