# teradata-vantage plugin — provenance manifest for content lifted from the private source repository.
#
# Consumed by scripts/sync_upstream.py. Every entry records the source path (relative to --root), the
# sha256 of the source at the time it was last imported or reviewed, the target inside the plugin, and the
# mode:
#   import  — the target is (re)generated from the source: copy, apply `transforms` in order (each with an
#             exact `expected_count`; a mismatch aborts the entry), leak-scan the result with
#             scripts/data/forbidden_tokens.txt, then write. Hand edits to the target are overwritten.
#   track   — the target was PORTED by hand (rewritten, merged with other material, or turned into hook/CLI
#             code). The tool only reports source drift; re-porting is a manual, reviewed task. `notes` says
#             what the port changed so a reviewer can repeat it.
# `--check` compares source sha256 values only and exits 1 on drift. This file is exempt from the leak scan
# because it must name the tokens it removes.
#
# Transform types
#   frontmatter_rewrite: {set: {...}, drop_keys: [...]} | {strip: true}
#   delete_section:      {heading: <regex on heading text>, expected_count: N}   (deletes to the next heading of
#                        the same or higher level)
#   replace:             {pattern: <regex>, replacement: <text>, flags: "im", expected_count: N}

version: 1
tokens_file: scripts/data/forbidden_tokens.txt
entries:

  # ---------------------------------------------------------------- imported skills (MIT, generic Teradata content)
  - id: vector-store-skill
    mode: import
    license: MIT
    source: config/skills/documentation/teradata/teradata-vector-store/SKILL.md
    sha256: c4629a0d51ae9bd92251b8a8aa37ae606af9aa67a305d44bb5e1773cd0e96d50
    target: skills/vector-store/SKILL.md
    notes: >
      Lifted as the body of the vector-store skill. Frontmatter rewritten to the plugin contract; the
      search_algorithm value list corrected. The skill author may extend the target with references/ and
      allowed-tools; keep those edits in the transforms below (or move the entry to mode: track) before
      re-running a real import, because a real import overwrites the target.
    transforms:
      - type: frontmatter_rewrite
        set:
          name: vector-store
          description: >-
            Use when creating, inspecting, querying, updating or repairing a Teradata Enterprise Vector Store
            (TDVS) with the tdvs_* tools — the mandatory target_database rule, the embeddings model / base-URL
            pairing, embedding dimensions, the physical vectorstore_* object layout, the V1/V2 API boundary and
            how to recover a CREATE FAILED store.
          when_to_use: >-
            "create a vector store", "similarity search over <db>.<table>", "why is my vector store CREATE
            FAILED", "which tables did TDVS create", "RAG over Teradata", tdvs_create / tdvs_similarity_search /
            tdvs_ask questions.
          license: MIT
          metadata:
            skill_type: documentation
            category: teradata
            version: "1.0.0"
        drop_keys: []
      - type: replace
        pattern: '`HNSW` / `FLAT` / `IVF_FLAT`'
        replacement: '`HNSW` / `KMEANS` / `VECTORDISTANCE`'
        expected_count: 1
      - type: replace
        pattern: 'The `tdvs_\*` MCP tools talk to the'
        replacement: 'The `tdvs_*` MCP tools (available when the server is installed with the `tdvs` extra and `TD_BASE_URL` is set) talk to the'
        expected_count: 1

