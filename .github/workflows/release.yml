name: release

# Fires on the tag `scripts/release.py` (and `claude plugin tag`) creates: teradata-vantage--v<version>.
# The `validate` workflow only runs on pull requests and pushes to `main`, so this job re-runs the same
# gates itself rather than assuming the tagged commit was ever checked.
on:
  push:
    tags: ["teradata-vantage--v*"]
  # Manual re-run: dispatch it on the TAG ref, not on a branch — every step below is derived from the tag name.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.263"   # keep in step with .github/workflows/validate.yml
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Resolve version from the tag and check it against plugin.json
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            teradata-vantage--v*) ;;
            *) echo "ref ${GITHUB_REF_NAME} is not a teradata-vantage--v<version> tag; dispatch this on the tag ref" >&2; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#teradata-vantage--v}"
          manifest=$(python -c 'import json;print(json.load(open("plugins/teradata-vantage/.claude-plugin/plugin.json"))["version"])')
          if [ "$version" != "$manifest" ]; then
            echo "tag ${GITHUB_REF_NAME} says ${version}, plugin.json says ${manifest}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI (pinned)
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Unit tests
        run: |
          python -m pip install --quiet pytest pyyaml
          python -m pytest plugins/teradata-vantage/scripts/tests -q -p no:cacheprovider

      - name: Plugin self-validation (manifests, tool names, grants, leak scan)
        run: python plugins/teradata-vantage/scripts/validate_plugin.py --repo . --no-cli

      - name: Vendored server drift check
        run: bash plugins/teradata-vantage/scripts/vendor_server.sh --check

      - name: claude plugin validate --strict (plugin)
        run: claude plugin validate plugins/teradata-vantage --strict

      - name: claude plugin validate --strict (marketplace)
        run: claude plugin validate . --strict

      # ONE code path builds the archive. scripts/release.py --zip-only packages the version already in
      # plugin.json, so what this job publishes is byte-for-byte what a maintainer builds locally. An
      # inline reimplementation here would drift from the script's exclude rules without anyone noticing.
      - name: Build the plugin archive
        run: python plugins/teradata-vantage/scripts/release.py --zip-only --repo .

      # `claude plugin validate` reads a directory, not an archive, so unpack first.
      - name: Validate the archive contents
        run: |
          python -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "dist/teradata-vantage-${{ steps.version.outputs.version }}.zip" "${RUNNER_TEMP}/archive"
          claude plugin validate "${RUNNER_TEMP}/archive/teradata-vantage" --strict

      - name: Release notes from the first CHANGELOG section
        run: awk '/^## /{n++} n==1' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/teradata-vantage-${{ steps.version.outputs.version }}.zip" \
            --verify-tag \
            --title "teradata-vantage ${{ steps.version.outputs.version }}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
