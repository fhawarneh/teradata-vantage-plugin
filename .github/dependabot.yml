# Keeps the pinned action SHAs in .github/workflows current. The Python dependency sets under
# plugins/teradata-vantage/servers/ are deliberately NOT covered: they are hash-pinned closures
# regenerated by scripts/vendor_server.sh, not files an updater should rewrite.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
